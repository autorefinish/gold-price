<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>구독의 법칙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap">
<style>
/* Layout: a phone-shaped app — status header, scrolling tab content, bottom tab bar; modals slide over it. */
:root {
  --ink: #1d1838;        /* deep indigo text/chrome */
  --paper: #f6f3ff;      /* lavender-white surface */
  --card: #ffffff;
  --line: #e3ddf7;
  --sub: #6c6590;        /* muted text */
  --pop: #ff5a7a;        /* subscribe pink */
  --violet: #6b4eff;     /* primary */
  --mint: #19c39a;       /* success / growth */
  --sun: #ffc23d;        /* money / highlight */
  --sky: #38b6ff;
  --display: "Jua", "Noto Sans KR", system-ui, sans-serif;
  --body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: #2a2350; font-family: var(--body); color: var(--ink); overflow: hidden; }
button { font-family: inherit; color: inherit; }
#app { position: relative; height: 100%; max-width: 460px; margin: 0 auto; background: var(--paper); display: flex; flex-direction: column; overflow: hidden; }

/* header */
.hdr { background: var(--ink); color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; }
.hdr-top { display: flex; align-items: center; gap: 10px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--pop), var(--violet)); display: grid; place-items: center; flex: none; }
.logo::after { content: ""; border-left: 11px solid #fff; border-top: 7px solid transparent; border-bottom: 7px solid transparent; margin-left: 3px; }
.ch-name { font-family: var(--display); font-size: 19px; line-height: 1.1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-sub { font-size: 11px; color: #b9b2e0; }
.hdr-btn { margin-left: auto; background: rgba(255,255,255,.1); border: 0; border-radius: 10px; width: 36px; height: 36px; font-size: 17px; cursor: pointer; flex: none; }
.stats { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 6px; }
.stat { background: rgba(255,255,255,.08); border-radius: 12px; padding: 6px 9px; min-width: 0; }
.stat b { display: block; font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat span { font-size: 10.5px; color: #b9b2e0; }
.stat.subs b { color: #ff8fa6; font-size: 24px; }
.stat.money b { color: var(--sun); }
.energy { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #cfc9f0; }
.ebar { flex: 1; height: 9px; background: rgba(255,255,255,.12); border-radius: 9px; overflow: hidden; }
.ebar i { display: block; height: 100%; background: linear-gradient(90deg, var(--mint), #7cf0c9); border-radius: 9px; transition: width .4s; }

/* content */
.content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.tab { display: none; padding: 12px max(14px, env(safe-area-inset-right, 0px)) 18px max(14px, env(safe-area-inset-left, 0px)); flex-direction: column; gap: 12px; }
.tab.on { display: flex; }
.sect-t { font-family: var(--display); font-size: 17px; margin: 4px 0 -2px; display: flex; align-items: center; gap: 6px; }
.sect-t small { font-family: var(--body); font-size: 11px; color: var(--sub); font-weight: 400; margin-left: auto; }

/* home */
.room { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 4 / 3.6; background: #3a3170 center/cover no-repeat; box-shadow: 0 6px 18px rgba(40,30,90,.18); }
.room .hero { position: absolute; bottom: -4%; left: 50%; height: 82%; transform: translateX(-50%); filter: drop-shadow(0 8px 12px rgba(0,0,0,.35)); }
.room .bubble { position: absolute; top: 12px; left: 12px; right: 12px; background: rgba(255,255,255,.94); border-radius: 14px; padding: 9px 12px; font-size: 13px; line-height: 1.45; box-shadow: 0 4px 10px rgba(0,0,0,.12); }
.room .bubble::after { content: ""; position: absolute; bottom: -8px; left: 50%; border: 8px solid transparent; border-top-color: rgba(255,255,255,.94); border-bottom: 0; }
.room .letter { position: absolute; right: 12px; bottom: 14px; background: #fff; border: 0; border-radius: 14px; padding: 8px 10px; font-size: 12px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.25); animation: bob 1.6s ease-in-out infinite; }
.room .letter .em { font-size: 22px; display: block; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.big-cta { border: 0; border-radius: 18px; padding: 15px; font-family: var(--display); font-size: 21px; color: #fff; background: linear-gradient(135deg, var(--pop), var(--violet)); box-shadow: 0 6px 0 #4128c4; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.big-cta:active { transform: translateY(3px); box-shadow: 0 3px 0 #4128c4; }
.big-cta small { font-family: var(--body); font-size: 12px; opacity: .85; }
.big-cta:disabled { filter: grayscale(.6); opacity: .7; cursor: default; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 11px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; text-align: left; cursor: pointer; }
.tile .t { font-weight: 800; font-size: 13.5px; display: flex; align-items: center; gap: 5px; }
.tile .d { font-size: 11.5px; color: var(--sub); line-height: 1.35; }
.tile.live-on { border-color: var(--pop); box-shadow: 0 0 0 2px rgba(255,90,122,.25); }
.dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--pop); display: inline-block; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.prog { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 7px; }
.prog .top { display: flex; justify-content: space-between; font-size: 12.5px; }
.prog .top b { font-family: var(--display); font-size: 15px; }
.pbar { height: 12px; border-radius: 12px; background: var(--line); overflow: hidden; }
.pbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--pop), var(--violet)); border-radius: 12px; transition: width .6s; }
.trend { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; font-weight: 800; border-radius: 999px; padding: 5px 11px; background: #efe9ff; color: var(--violet); }
.chip.hot { background: #ffe4ea; color: #e2365a; }
.quests { display: flex; flex-direction: column; gap: 6px; }
.quest { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 9px 11px; }
.quest .q-t { flex: 1; font-size: 13px; min-width: 0; }
.quest .q-t small { display: block; color: var(--sub); font-size: 11px; }
.qbtn { border: 0; border-radius: 10px; padding: 7px 10px; font-weight: 800; font-size: 12px; background: var(--line); color: var(--sub); white-space: nowrap; }
.qbtn.ready { background: var(--sun); color: var(--ink); cursor: pointer; }
.qbtn.done { background: transparent; color: var(--mint); }

/* channel */
.vid { display: flex; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px; cursor: pointer; text-align: left; align-items: stretch; width: 100%; }
.thumb { position: relative; width: 44%; flex: none; aspect-ratio: 16 / 9; border-radius: 11px; overflow: hidden; background: #333 center/cover; }
.thumb img.face { position: absolute; left: -4%; bottom: -12%; height: 118%; filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff); }
.thumb .tt { position: absolute; right: 5%; top: 8%; width: 58%; font-family: var(--display); font-size: 13px; line-height: 1.1; color: #fff; text-align: right; -webkit-text-stroke: 3px #000; paint-order: stroke fill; word-break: keep-all; }
.thumb .viral { position: absolute; left: 6px; top: 6px; background: var(--pop); color: #fff; font-size: 10px; font-weight: 800; border-radius: 6px; padding: 2px 5px; }
.vid .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 2px 0; }
.vid .vt { font-weight: 800; font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vid .vm { font-size: 11.5px; color: var(--sub); font-variant-numeric: tabular-nums; }
.vid .vg { font-size: 11.5px; color: var(--mint); font-weight: 800; font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--sub); font-size: 13.5px; padding: 30px 10px; background: var(--card); border: 1px dashed var(--line); border-radius: 16px; line-height: 1.6; }

/* shop & collection */
.item { display: flex; align-items: center; gap: 11px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 11px; }
.item .ic { font-size: 28px; width: 42px; text-align: center; flex: none; }
.item .mid { flex: 1; min-width: 0; }
.item .nm { font-weight: 800; font-size: 14px; }
.item .ds { font-size: 11.5px; color: var(--sub); line-height: 1.4; }
.lv { display: flex; gap: 3px; margin-top: 4px; }
.lv i { width: 16px; height: 5px; border-radius: 3px; background: var(--line); }
.lv i.on { background: var(--violet); }
.buy { border: 0; border-radius: 12px; padding: 9px 10px; font-weight: 800; font-size: 12.5px; background: var(--sun); cursor: pointer; white-space: nowrap; min-width: 84px; }
.buy:disabled { background: var(--line); color: var(--sub); cursor: default; }
.fans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fan { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; cursor: pointer; min-width: 0; }
.fan img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
.fan.locked img { filter: grayscale(1) brightness(.5) blur(1px); }
.fan .nm { font-weight: 800; font-size: 13.5px; }
.fan .ds { font-size: 11px; color: var(--sub); }
.hearts { color: var(--pop); font-size: 12px; letter-spacing: 1px; }
.combo { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 9px 11px; font-size: 13px; }
.combo.locked { color: var(--sub); background: transparent; border-style: dashed; }
.combo b { font-family: var(--display); font-size: 15px; }

/* tab bar */
.tabbar { display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-top: 1px solid var(--line); padding: 4px max(6px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 4px) max(6px, env(safe-area-inset-left, 0px)); }
.tabbar button { background: none; border: 0; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--sub); cursor: pointer; position: relative; }
.tabbar button span { font-size: 21px; filter: grayscale(1); opacity: .6; }
.tabbar button.on { color: var(--violet); font-weight: 800; }
.tabbar button.on span { filter: none; opacity: 1; }
.badge { position: absolute; top: 3px; right: 26%; background: var(--pop); color: #fff; border-radius: 9px; font-size: 10px; font-weight: 800; padding: 0 5px; min-width: 16px; }

/* modals */
.modal { position: absolute; inset: 0; background: rgba(20,14,50,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 30; }
.modal[hidden] { display: none; }
.sheet { background: var(--paper); width: 100%; max-height: 94%; border-radius: 24px 24px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; animation: up .25s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: 23px; margin: 0; }
.sheet .lead { font-size: 13px; color: var(--sub); margin: -6px 0 0; line-height: 1.5; }
.steps { display: flex; gap: 5px; }
.steps i { flex: 1; height: 5px; border-radius: 5px; background: var(--line); }
.steps i.on { background: var(--violet); }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 9px 4px 8px; text-align: center; cursor: pointer; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.card .em { font-size: 26px; }
.card .nm { font-weight: 800; font-size: 12.5px; }
.card .ds { font-size: 10.5px; color: var(--sub); }
.card.sel { border-color: var(--violet); background: #efe9ff; }
.card .tag { position: absolute; top: -7px; right: -4px; background: var(--pop); color: #fff; font-size: 9.5px; font-weight: 800; border-radius: 6px; padding: 1px 5px; }
.card.locked { opacity: .4; cursor: default; }
.pred { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 12.5px; line-height: 1.65; }
.pred .combo-hit { color: #e2365a; font-weight: 800; }
.actions { display: flex; gap: 8px; }
.btn { flex: 1; border: 0; border-radius: 14px; padding: 13px; font-weight: 800; font-size: 15px; cursor: pointer; background: var(--violet); color: #fff; }
.btn.ghost { background: var(--line); color: var(--ink); flex: 0 0 34%; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .card:focus-visible, .buy:focus-visible, .tile:focus-visible, .vid:focus-visible, .big-cta:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* minigames */
.mg { background: var(--ink); border-radius: 18px; padding: 14px; color: #fff; display: flex; flex-direction: column; gap: 10px; align-items: center; user-select: none; }
.mg .hint { font-size: 13px; color: #cfc9f0; text-align: center; }
.meter { position: relative; width: 100%; height: 46px; border-radius: 14px; background: #3b3266; overflow: hidden; }
.meter .zone { position: absolute; top: 0; bottom: 0; background: rgba(25,195,154,.45); border-left: 2px solid var(--mint); border-right: 2px solid var(--mint); }
.meter .zone.perfect { background: rgba(255,194,61,.6); border-color: var(--sun); }
.meter .needle { position: absolute; top: -4px; bottom: -4px; width: 5px; background: #fff; border-radius: 3px; box-shadow: 0 0 10px #fff; }
.mg-arena { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 14px; background: radial-gradient(circle at 50% 40%, #4a3f86, #251e4a); overflow: hidden; touch-action: manipulation; }
.target { position: absolute; width: 18%; aspect-ratio: 1; border-radius: 50%; border: 0; font-size: 26px; display: grid; place-items: center; cursor: pointer; background: radial-gradient(circle at 35% 35%, #fff, #ffd76b 40%, #ff8a3d); box-shadow: 0 0 14px rgba(255,200,80,.8); animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(.3); } }
.grid9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; width: 100%; }
.cell { aspect-ratio: 1; border-radius: 12px; border: 0; background: #3b3266; font-size: 30px; cursor: pointer; display: grid; place-items: center; transition: background .1s; }
.cell.star { background: #ffe9a8; }
.mg .score { font-family: var(--display); font-size: 20px; }
.tap-btn { width: 100%; border: 0; border-radius: 14px; padding: 15px; font-family: var(--display); font-size: 20px; background: var(--sun); color: var(--ink); cursor: pointer; }
.result { text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.stars { font-size: 30px; letter-spacing: 3px; color: var(--sun); }

/* editing */
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.thumbs .opt { border: 3px solid transparent; border-radius: 13px; padding: 0; cursor: pointer; background: none; display: flex; flex-direction: column; gap: 3px; align-items: stretch; font-size: 11.5px; font-weight: 800; }
.thumbs .opt .thumb { width: 100%; }
.thumbs .opt .thumb .tt { font-size: 9.5px; -webkit-text-stroke: 2.5px #000; }
.thumbs .opt.sel { border-color: var(--violet); }
.hooks { display: flex; flex-direction: column; gap: 7px; }
.hook { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 13px; padding: 9px 11px; cursor: pointer; font-size: 13.5px; font-weight: 800; display: flex; flex-direction: column; gap: 2px; }
.hook small { font-weight: 400; font-size: 11px; color: var(--sub); }
.hook.sel { border-color: var(--violet); background: #efe9ff; }
.preview { display: flex; gap: 10px; align-items: center; }
.preview .thumb { width: 52%; }

/* video detail */
.graph { width: 100%; height: 110px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 7px 9px; }
.kpi b { display: block; font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 10.5px; color: var(--sub); }
.cmt { display: flex; gap: 9px; align-items: flex-start; }
.cmt .av { width: 34px; height: 34px; border-radius: 50%; flex: none; background: #ddd center/cover; display: grid; place-items: center; font-size: 17px; }
.cmt .bd { flex: 1; min-width: 0; font-size: 13px; line-height: 1.45; }
.cmt .who { font-weight: 800; font-size: 12px; }
.cmt .who.named { color: var(--violet); }
.cmt .who.snow { color: #2a9fd6; }
.heart { border: 0; background: none; font-size: 18px; cursor: pointer; padding: 2px 4px; filter: grayscale(1); opacity: .5; }
.heart.on { filter: none; opacity: 1; }

/* story */
.story { position: absolute; inset: 0; z-index: 50; background: #140f30; color: #fff; display: flex; flex-direction: column; }
.story[hidden] { display: none; }
.story .pic { flex: 1; background: #221a48 center/cover no-repeat; position: relative; min-height: 0; }
.story .pic img.who { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 92%; filter: drop-shadow(0 6px 16px rgba(0,0,0,.5)); }
.story .box { padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(18px, env(safe-area-inset-left, 0px)); background: linear-gradient(#1a1440, #140f30); display: flex; flex-direction: column; gap: 10px; }
.story .spk { font-family: var(--display); font-size: 17px; color: #ffb3c4; }
.story .txt { font-size: 15.5px; line-height: 1.7; min-height: 5.1em; white-space: pre-line; }
.story .nxt { align-self: flex-end; border: 0; background: var(--pop); color: #fff; font-weight: 800; border-radius: 12px; padding: 11px 18px; font-size: 14px; cursor: pointer; }
.story .chap { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 16px; background: rgba(0,0,0,.45); border-radius: 10px; padding: 5px 10px; font-family: var(--display); font-size: 14px; }
.setup { display: flex; flex-direction: column; gap: 10px; }
.pick2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick2 button { border: 3px solid transparent; border-radius: 16px; background: #2a2259; padding: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: #fff; font-weight: 800; font-size: 13px; }
.pick2 button img { height: 140px; object-fit: contain; }
.pick2 button.sel { border-color: var(--pop); }
.setup input { width: 100%; border: 2px solid #4a3f86; background: #221a48; color: #fff; border-radius: 12px; padding: 12px; font-size: 16px; font-family: var(--body); }
.setup input:focus { outline: none; border-color: var(--pop); }

/* toast */
.toasts { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 140px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 60; pointer-events: none; padding: 0 16px; }
.toast { background: var(--ink); color: #fff; border-radius: 14px; padding: 10px 14px; font-size: 13px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.3); animation: tin .3s ease-out; max-width: 100%; }
@keyframes tin { from { transform: translateY(-10px); opacity: 0; } }
.float-sub { position: absolute; font-family: var(--display); color: #ff8fa6; font-size: 18px; pointer-events: none; animation: fl 1.2s ease-out forwards; z-index: 61; }
@keyframes fl { to { transform: translateY(-40px); opacity: 0; } }

/* live */
.live-arena { position: relative; width: 100%; height: 330px; border-radius: 16px; overflow: hidden; background: #18122e; }
.live-msg { position: absolute; left: 10px; right: 10px; border: 0; text-align: left; border-radius: 12px; padding: 8px 10px; font-size: 13px; color: #fff; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.live-msg.q { background: #2f4fb8; }
.live-msg.p { background: #3b3266; }
.live-msg.t { background: #a3243f; }
.live-msg.d { background: #b8860b; }
.live-msg.done { opacity: .35; text-decoration: line-through; }
.live-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.live-top .lv-badge { background: var(--pop); color: #fff; border-radius: 6px; padding: 2px 8px; font-weight: 800; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <div class="hdr-top">
      <div class="logo" aria-hidden="true"></div>

  const h = Math.max(0, (t - v.t) / HOUR);
  let views = v.P * (1 - Math.exp(-h / TAU));
  if (v.viralAt && t > v.viralAt) views += v.P * (v.viralMult - 1) * (1 - Math.exp(-((t - v.viralAt) / HOUR) / 3));

  return Math.floor(views);
}

  const gained = Math.floor((t - S.energyAt) / E_REGEN);
  if (gained > 0) { S.energy = Math.min(E_MAX, S.energy + gained); S.energyAt += gained * E_REGEN; if (S.energy >= E_MAX) S.energyAt = t; }

function beep(f, d = .08, type = 'triangle', v = .05, slide = 0) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();

/* ============ daily systems ============ */
function trendFor(day) {
  const r = seeded(hash('trend' + day));
  const gs = Object.keys(GENRES), fs = Object.keys(FORMATS);
  return { g: gs[Math.floor(r() * gs.length)], f: fs[Math.floor(r() * fs.length)], word: pick(['#겨울', '#자취', '#직장인', '#힐링', '#가성비', '#챌린지', '#새해', '#주말']) };
}
function makeQuests(day) {
  const r = seeded(hash('q' + day));
  const pool = [
    { id: 'up2', t: '영상 2개 올리기', need: 2, rw: { energy: 30 } },
    { id: 'trend', t: '오늘의 트렌드 소재로 영상 올리기', need: 1, rw: { money: 20000 } },
    { id: 'heart', t: '댓글에 하트 3개 누르기', need: 3, rw: { energy: 15 } },
    { id: 'perfect', t: '촬영에서 별 3개 받기', need: 1, rw: { money: 15000 } },
    { id: 'combo', t: '레시피 조합으로 영상 올리기', need: 1, rw: { energy: 20 } },
  ];
  const list = pool.slice().sort(() => r() - .5).slice(0, 3).map(q => ({ ...q, have: 0, claimed: false }));
  if (S.subsBonus + 0 >= 0 && totals().subs >= 100) list[2] = { id: 'live', t: '라이브 방송 1번 하기', need: 1, rw: { money: 25000 }, have: 0, claimed: false };
  return list;
}
function questProgress(id, n = 1) {
  for (const q of S.quests.list) if (q.id === id && !q.claimed) q.have = Math.min(q.need, q.have + n);
  renderQuests();
}
function dailyCheck() {
  const d = dayKey();
  if (S.day === d) return;
  const first = !S.day;
  const y = new Date(now() - 86400e3); const yk = y.getFullYear() + '-' + (y.getMonth() + 1) + '-' + y.getDate();
  S.streak = S.day === yk ? S.streak + 1 : 1;
  S.day = d;
  S.quests = { day: d, list: makeQuests(d) };
  if (S.videos.length) S.letters.availDay = d;   // a new letter from 첫눈 each day once the channel exists
  if (!first) {
    const bonus = 5000 * Math.min(7, S.streak);
    syncEnergy(); S.energy = Math.min(E_MAX + 40, S.energy + 40);
    S.money += bonus;
    setTimeout(() => toast(`📅 ${S.streak}일 연속 접속! ⚡+40 · 💰+${won(bonus)}`, 3500), 600);
  }
  dirty();
}
function liveWindow(t = now()) {
  const d = new Date(t), m = d.getHours() * 60 + d.getMinutes();
  if (m >= 11 * 60 + 30 && m < 13 * 60 + 30) return 'lunch';
  if (m >= 19 * 60 && m < 23 * 60 + 30) return 'night';
  return null;
}
function nextLiveText() {

}

function mgTiming(header) {
  // tap when the needle is inside the zone, 3 times
  let round = 0, total = 0, x = 0, dir = 1, speed = 1.25, raf, last = performance.now();
  const zones = [];
  const draw = () => {
    const z = zones[round] || zones[zones.length - 1];
    openSheet(`${header}<p class="lead">바늘이 초록 칸에 들어왔을 때 탭! 노란 칸은 완벽 (${round + 1}/3)</p>
      <div class="mg"><div class="meter" id="meter"><div class="zone" style="left:${z.a}%;width:${z.w}%"></div><div class="zone perfect" style="left:${z.a + z.w * .35}%;width:${z.w * .3}%"></div><div class="needle" id="needle"></div></div>
      <div class="hint">${P.genre === 'cook' ? '🍳 불 조절 타이밍!' : '🍜 한입 크게 먹는 타이밍!'}</div><button class="tap-btn" id="tap">지금!</button></div>`);
    $('tap').onclick = hit;
  };
  for (let i = 0; i < 3; i++) { const w = 22 - i * 3; zones.push({ a: rnd(8, 92 - w), w }); }
  const loop = t => {
    const dt = (t - last) / 1000; last = t;
    x += dir * speed * dt * 100; if (x > 100) { x = 100; dir = -1; } if (x < 0) { x = 0; dir = 1; }
    const n = $('needle'); if (n) n.style.left = `calc(${x}% - 2px)`;
    raf = requestAnimationFrame(loop);
  };
  const hit = () => {
    const z = zones[round], c = z.a + z.w / 2, d = Math.abs(x - c);
    const sc = d < z.w * .15 ? 1 : d < z.w / 2 ? .7 : Math.max(0, .35 - (d - z.w / 2) / 60);
    total += sc; beep(sc >= 1 ? 1200 : sc > .5 ? 800 : 300, .08);

}

function commentsFor(v) {
  const n = viewsOf(v), r = seeded(v.seed);

  const tt = totals();
  const list = [];

  const fanKeys = Object.keys(FANS).filter(k => tt.subs >= FANS[k].unlock || (k === 'junseo'));
  for (let i = 0; i < count; i++) {
    const roll = r();
    if (roll < .28 && fanKeys.length) {
      const k = fanKeys[Math.floor(r() * fanKeys.length)];
      if (list.some(c => c.fan === k)) continue;
      const pool = { junseo: ['1등!! ㅋㅋㅋ', '이거 친구들한테 보여줄게요', '다음엔 게임 해주세요!!'], night: ['근무 끝나고 보는 중이에요', '오늘도 위로받고 가요', '새벽에 보기 딱 좋아요'], fact: ['편집 템포 조금만 더 빠르게.', '이번 건 인정.', '썸네일 글씨 키우세요.'], momo: ['자막 고마워요!!', '한국어 공부 중이에요 ㅎㅎ', '이 가게 어디예요?'] }[k];
      list.push({ id: v.id + '-f' + i, fan: k, who: FANS[k].name, txt: pool[Math.floor(r() * pool.length)] });
    } else {
      const pool = (v.hook === 'bait' && r() < .45) ? CMT.bait : r() < .5 ? CMT[v.genre] : CMT.any;
      list.push({ id: v.id + '-' + i, who: NICKS[Math.floor(r() * NICKS.length)], txt: pool[Math.floor(r() * pool.length)] });
    }
  }
  return list;
}

      <div style="font-size:12px;color:var(--sub)">${h < 24 ? `업로드 ${ago(v.t)} · 24시간 동안 계속 올라요` : '안정기 · 앞으로 한 달간 꾸준히 조금씩 올라요'}${v.viralAt && now() < v.viralAt ? '' : v.viralAt ? ' · 🔥 알고리즘 추천을 탔어요!' : ''}</div>
      <div class="sect-t">💬 댓글 ${cm.length}개 <small>하트로 팬과 친해져요</small></div>
      <div style="display:flex;flex-direction:column;gap:11px" id="cmts">${cm.length ? cm.map(c => `<div class="cmt"><div class="av" style="${c.fan ? `background-image:url(${A(FANS[c.fan].img)})` : ''}">${c.fan ? '' : c.snow ? '❄️' : '🙂'}</div>
        <div class="bd"><div class="who ${c.fan ? 'named' : ''} ${c.snow ? 'snow' : ''}">${esc(c.who)}</div>${esc(c.txt)}</div>
        <button class="heart ${S.hearted[c.id] ? 'on' : ''}" data-c="${c.id}" data-fan="${c.fan || ''}" aria-label="하트">❤️</button></div>`).join('') : '<div class="empty" style="padding:14px">아직 댓글이 없어요. 조회수가 오르면 달려요!</div>'}</div>
      <div class="actions"><button class="btn" id="cls">닫기</button></div>`);
    drawGraph($('graph'), v);
    $('cls').onclick = () => { clearInterval(detailTimer); closeSheet(); };
    $('cmts').onclick = e => {
      const b = e.target.closest('.heart'); if (!b || S.hearted[b.dataset.c]) return;
      S.hearted[b.dataset.c] = 1; b.classList.add('on'); beep(1000, .06); questProgress('heart');
      const k = b.dataset.fan;
      if (k) {
        S.fans[k] = (S.fans[k] || 0) + 1;
        if ([1, 3, 6].includes(S.fans[k])) { S.bookNew = true; updateBadges(); toast(`💗 ${FANS[k].name}의 이야기가 열렸어요! (도감)`, 3200); }
        else toast(`💗 ${FANS[k].name}와(과) 조금 더 친해졌어요`);
      }
      dirty();
    };
  };
  draw();
  clearInterval(detailTimer);
  detailTimer = setInterval(() => { if ($('modal').hidden) { clearInterval(detailTimer); return; } const st = $('sheet').scrollTop; const g = $('graph'); if (!g) return; drawGraph(g, v); const k = $('sheet').querySelector('.kpi b'); if (k) k.textContent = fmt(viewsOf(v)); }, 1000);
}
function drawGraph(cv, v) {
  const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr; const c = cv.getContext('2d'); c.scale(dpr, dpr);
  const span = Math.max(24 * HOUR, Math.min(now() - v.t, 72 * HOUR)), end = v.t + span;
  const maxV = Math.max(10, viewsOf(v, end) * 1.05);
  c.strokeStyle = '#e3ddf7'; c.lineWidth = 1;
  for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(0, h * i / 4); c.lineTo(w, h * i / 4); c.stroke(); }
  const pts = []; for (let i = 0; i <= 60; i++) { const t = v.t + span * i / 60; pts.push([w * i / 60, h - 8 - (h - 16) * viewsOf(v, t) / maxV, t]); }
  const nowX = w * clamp((now() - v.t) / span, 0, 1);
  c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y));
  c.setLineDash([4, 4]); c.strokeStyle = '#c9bff5'; c.lineWidth = 2; c.stroke(); c.setLineDash([]);
  c.save(); c.beginPath(); c.rect(0, 0, nowX, h); c.clip();
  const gr = c.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(255,90,122,.35)'); gr.addColorStop(1, 'rgba(255,90,122,0)');
  c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.lineTo(w, h); c.lineTo(0, h); c.fillStyle = gr; c.fill();
  c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.strokeStyle = '#ff5a7a'; c.lineWidth = 2.5; c.stroke(); c.restore();
  const ny = h - 8 - (h - 16) * viewsOf(v) / maxV;
  c.fillStyle = '#ff5a7a'; c.beginPath(); c.arc(nowX, ny, 4.5, 0, 7); c.fill();
  c.fillStyle = '#6c6590'; c.font = '11px Noto Sans KR, sans-serif'; c.fillText('지금', Math.min(w - 26, nowX + 6), Math.max(12, ny - 6));
}

/* ============ live broadcast ============ */
$('liveTile').addEventListener('click', () => {
  const tt = totals(), w = liveWindow(), key = S.day + '-' + w;
  if (tt.subs < 100) { toast('🔒 구독자 100명이 되면 라이브를 열 수 있어요'); return; }

});
function runLive() {
  $('modal').dataset.lock = '1';

  openSheet(`<h2>🔴 라이브 방송</h2><p class="lead">파란 질문에 답하고(탭), 빨간 악플은 탭해서 차단하세요. 💰 후원은 자동으로 들어와요.</p>
    <div class="live-top"><span class="lv-badge">LIVE</span><span>👀 ${fmt(viewers)}명 시청 중</span><span id="lt">25초</span></div>
    <div class="live-arena" id="la"></div><div class="pred" id="lsum">답변 0 · 차단 0 · 후원 0원</div>`);
  const la = $('la');
  const types = [['q', 0.38], ['p', 0.3], ['t', 0.2], ['d', 0.12]];
  const texts = {
    q: ['카메라 뭐 쓰세요?', '다음 영상 주제 뭐예요?', '몇 살이에요?', '구독자 몇 명 목표예요?', '좋아하는 음식 뭐예요?', '편집 혼자 해요?'],
    p: ['오늘도 재밌어요 ㅋㅋ', '목소리 좋다', '처음 와봐요!', 'ㅋㅋㅋㅋㅋ', '하이하이~'],
    t: ['노잼', '구독 취소함 ㅋ', '이걸 왜 봄?', '광고 아님?'],
    d: ['💰 1,000원 후원! 힘내요', '💰 5,000원 후원! 치킨 사드세요', '💰 2,000원 후원! 응원해요'],
  };
  const spawn = () => {
    let r = Math.random(), tp = 'q'; for (const [k, p] of types) { if ((r -= p) <= 0) { tp = k; break; } }
    const b = document.createElement('button'); b.className = 'live-msg ' + tp;
    const nick = pick(NICKS); b.innerHTML = `<b>${nick}</b> ${esc(pick(texts[tp]))}`;
    b.style.top = '100%'; la.appendChild(b);
    let top = 100;
    const mv = setInterval(() => { top -= 1.1; b.style.top = top + '%'; if (top < -18) { clearInterval(mv); if (tp === 't' && !b.dataset.done) missedTrolls++; b.remove(); } }, 50);
    if (tp === 'd') { const m = [1000, 5000, 2000][texts.d.findIndex(x => b.textContent.includes(x))] || 1000; dona += m; beep(1500, .08); upd(); }
    b.onclick = () => {
      if (b.dataset.done) return; b.dataset.done = 1;
      if (tp === 'q') { answered++; b.classList.add('done'); beep(900, .05); }
      else if (tp === 't') { bans++; b.classList.add('done'); b.innerHTML = '🚫 차단됨'; beep(300, .06); }
      else if (tp === 'p') { b.classList.add('done'); beep(700, .04); }
      upd();
    };
  };
  const upd = () => { const s = $('lsum'); if (s) s.textContent = `답변 ${answered} · 차단 ${bans} · 후원 ${won(dona)}`; };
  const sp = setInterval(spawn, 750); spawn();
  const tm = setInterval(() => {
    left--; const lt = $('lt'); if (lt) lt.textContent = left + '초';
    if (left <= 0) {
      clearInterval(sp); clearInterval(tm);
      const gain = Math.round((answered * 2.5 + bans * 1.5) * (1 + tt.subs / 400));
      S.subsBonus += gain; S.money += dona; S.trust = clamp(S.trust + bans * .5 - missedTrolls, 20, 100);
      questProgress('live'); dirty(); save();
      openSheet(`<h2>방송 종료!</h2><div class="pred">💬 질문 답변 ${answered}개 · 🚫 악플 차단 ${bans}개${missedTrolls ? ` · 놓친 악플 ${missedTrolls}개` : ''}<br>
        <b style="font-size:16px">구독자 +${fmt(gain)}명 · 후원 ${won(dona)}</b></div>

}

/* ============ drinks, letters, settings ============ */
$('drinkTile').addEventListener('click', () => {
  if (S.drinks.day !== S.day) S.drinks = { day: S.day, n: 0 };
  if (S.drinks.n >= 3) { toast('오늘은 더 마시면 몸에 안 좋아요 😵'); return; }
  if (S.money < 5000) { toast('💸 잔고가 부족해요'); return; }
  syncEnergy(); S.money -= 5000; S.energy = Math.min(E_MAX + 40, S.energy + 30); S.drinks.n++;
  beep(600, .1, 'sine', .05, 400); toast('🥤 꿀꺽! ⚡+30'); dirty(); renderAll();
});
$('letterBtn').addEventListener('click', () => {
  const i = S.letters.read, txt = SNOW_LETTERS[Math.min(i, SNOW_LETTERS.length - 1)];

const tt0 = () => totals();
$('setBtn').addEventListener('click', () => {
  openSheet(`<h2>설정</h2>
    <div class="item"><div class="ic">⏩</div><div class="mid"><div class="nm">시간 가속 (테스트용)</div><div class="ds">켜면 게임 속 시간이 60배 빨리 흘러요. 1분 = 1시간. 성장 흐름을 빨리 확인할 때 쓰세요.</div></div><button class="buy" id="warp">${S.warp ? '끄기' : '켜기'}</button></div>
    <div class="item"><div class="ic">💾</div><div class="mid"><div class="nm">저장</div><div class="ds">${db ? '클라우드에 자동 저장 중 (내 계정 전용)' : '이 브라우저에 자동 저장 중'}</div></div></div>
    <div class="item"><div class="ic">🗑</div><div class="mid"><div class="nm">처음부터 다시 하기</div><div class="ds">진행 상황이 모두 지워져요.</div></div><button class="buy" id="reset" style="background:#ffd5dd">초기화</button></div>
    <div class="actions"><button class="btn" id="cls">닫기</button></div>`);
  $('warp').onclick = () => { S.warp = !S.warp; dirty(); closeSheet(); toast(S.warp ? '⏩ 시간 가속 ON (60배)' : '⏸ 시간 가속 OFF'); };
  $('reset').onclick = () => {
    $('reset').textContent = '정말요?'; $('reset').onclick = async () => {
      S = fresh(); try { localStorage.removeItem(LS_KEY); } catch (e) {}
      if (db && uid) { try { await db.doc('data/users/' + uid + '/save').delete(); } catch (e) {} }
      closeSheet(); boot();
    };
  };
  $('cls').onclick = closeSheet;
});

/* ============ milestones, monetization, viral alerts ============ */
function milestoneCheck(tt) {
  if (!S.started || !$('story').hidden) return;
  const ci = chapterIdx(tt.subs);
  if (ci > S.chapterSeen) {
    S.chapterSeen = ci; dirty();
    if (ci === 1) playStory([
      { bg: 'room1', chap: '챕터 1 클리어!', who: heroImg('wow'), spk: '나', txt: '구독자 100명…!\n100명이 내 영상을 기다린다니, 믿기지가 않아.' },
      { bg: 'room1', chap: '챕터 2 · 첫 알고리즘', txt: '🔓 라이브 방송이 열렸어요! (점심·저녁 시간)\n🔓 양념 카드가 열렸어요: 엄마 출연, 고양이, 실패 편집\n\n다음 목표: 구독자 1,000명 — 수익 창출!', btn: '계속하기' },
    ], renderAll);
    else if (ci === 2) {
      startMonetization();
      playStory([
        { bg: 'room2', chap: '챕터 2 클리어!', who: heroImg('wow'), spk: '나', txt: '구독자 1,000명!!\n수익 창출 신청이… 승인됐다!' },
        { bg: 'room2', spk: '나', who: heroImg('smile'), txt: '첫 수익으로 방도 조금 꾸며봤다.\n이제 반지하가 아니라, 내 스튜디오야.' },
        { bg: 'room2', chap: '챕터 3 · 수익화', txt: '💰 이제 조회수가 오를 때마다 수익이 실시간으로 들어와요.\n번 돈으로 장비를 바꾸면 영상이 더 좋아져요.\n\n다음 목표: 구독자 1만 명', btn: '계속하기' },
      ], renderAll);
    } else if (ci === 3) playStory([
      { bg: 'room2', chap: '챕터 3 클리어!', who: heroImg('wow'), spk: '나', txt: '구독자 1만 명.\n…그런데 같은 날 채널을 연 \'하이퍼\'는 벌써 10만이래.' },
      { bg: 'room2', spk: '첫눈', txt: '"숫자 말고 사람을 봐요. 당신 속도대로 가면 돼요."' },
      { bg: 'room2', chap: '챕터 4 · 라이벌 — 다음 업데이트에서 계속', txt: '프로토타입은 여기까지예요!\n계속 영상을 올리며 채널을 키울 수 있어요.', btn: '계속 키우기' },
    ], renderAll);
  }
}
function startMonetization() {
  if (S.monetizedAt) return;
  S.monetizedAt = now(); for (const v of S.videos) v.monoBase = viewsOf(v); dirty();
}
function moneyTick() {
  if (!S.monetizedAt) return 0;
  let earned = 0;
  for (const v of S.videos) {
    const n = viewsOf(v), base = Math.max(v.monoBase || 0, v.lastMoneyViews || 0);
    if (n > base) { earned += (n - base) * 1.5; v.lastMoneyViews = n; }
  }
  S.money += Math.floor(earned);
  return earned;
}
function viralCheck() {
  for (const v of S.videos) if (v.viralAt && !v.notified && now() > v.viralAt) {
    v.notified = true; dirty();
    toast(`🔥 "${v.short}" 영상이 알고리즘 추천을 탔어요!`, 4000); beep(784, .12); setTimeout(() => beep(1046, .2), 120);
  }
}

/* ============ away summary ============ */
function awaySummary(prev) {
  const away = Date.now() - (prev.lastSeenReal || 0);
  if (!prev.lastSeenReal || away < 10 * MIN) return;
  const before = totalsAt(prev.lastSeen), after = totals();
  const dSubs = after.subs - before.subs, dViews = after.views - before.views;
  if (dViews < 1) return;
  const hrs = away / HOUR;
  openSheet(`<h2>👋 다녀왔어요!</h2><p class="lead">${hrs >= 1 ? Math.floor(hrs) + '시간' : Math.floor(away / MIN) + '분'} 동안 영상들이 일했어요.</p>
    <div class="kpis"><div class="kpi"><b>+${fmt(dViews)}</b><span>조회수</span></div><div class="kpi"><b style="color:var(--pop)">+${fmt(dSubs)}</b><span>구독자</span></div><div class="kpi"><b>⚡${S.energy}</b><span>에너지</span></div></div>
    ${S.videos.filter(v => v.viralAt && v.viralAt > prev.lastSeen && v.viralAt < now()).map(v => `<div class="pred">🔥 "${esc(v.short)}" 영상이 자는 사이 알고리즘 추천을 탔어요!</div>`).join('')}
    <div class="actions"><button class="btn" id="cls">좋아요!</button></div>`);
  $('cls').onclick = closeSheet; ding();
}
function totalsAt(t) { return totals(t); }

/* ============ main loop ============ */
let lastTick = Date.now();
function tick() {
  const real = Date.now(), dt = real - lastTick; lastTick = real;
  if (S && S.warp) S.warpOffset += dt * 59;
  if (!S || !S.started) return;
  const d = dayKey(); if (d !== S.day) { dailyCheck(); renderAll(); }
  const tt = totals();
  if (tt.subs >= 1000 && !S.monetizedAt) startMonetization();
  moneyTick(); viralCheck(); milestoneCheck(tt);
  renderHeader(tt);
  if (curTab === 'home') renderHomeLight(tt);
  if (curTab === 'channel') updateChannelLive();
  S.lastSeenReal = real;
}
function renderHomeLight(tt) {
  const ci = chapterIdx(tt.subs), ch = CHAPTERS[ci], prev = ci ? CHAPTERS[ci - 1].goal : 0;
  $('chapGoal').textContent = `${fmt(tt.subs)} / ${fmt(ch.goal)}`;
  $('chapBar').style.width = clamp((tt.subs - prev) / (ch.goal - prev) * 100, 0, 100) + '%';
  syncEnergy();
  const can = S.energy >= 25;
  if ($('makeBtn').disabled === can) renderHome();
  else if (!can) $('makeBtn').innerHTML = `😴 에너지 충전 중 <small>${mmss(E_REGEN * (25 - S.energy) - (now() - S.energyAt))} 후 가능</small>`;
}
setInterval(tick, 1000);
setInterval(() => { if (S && S.started) save(); }, 30000);

/* ============ boot ============ */
function boot(fromCloud) {
  if (!S) S = loadLocal() ? Object.assign(fresh(), loadLocal()) : fresh();
  const prev = { lastSeen: S.lastSeen, lastSeenReal: S.lastSeenReal };
  if (!S.started) { prologue(); return; }
  $('story').hidden = true;
  dailyCheck(); syncEnergy(); moneyTick();
  const tt = totals(); shown = { subs: tt.subs, views: tt.views, money: S.money };
  renderAll(); updateBadges();
  awaySummary(prev);
  S.lastSeenReal = Date.now();
}
boot();
connectCloud();

window.__sl = { get S() { return S; }, totals, viewsOf, setNow: ms => { S.warpOffset += ms; } };
})();
