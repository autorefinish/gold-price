<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Paint Bomb Rush</title>
<style>
  :root {
    --bg: #14131c;
    --panel: rgba(20,19,28,.88);
    --text: #f4f1ea;
    --muted: #a9a4b8;
    --accent: #ffd23f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { position: relative; }
  canvas { display: block; border-radius: 14px; }
  #controls { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 8px; justify-content: center; padding: 0 10px; }
  .cbtn { flex: 1; max-width: 86px; height: 60px; border-radius: 16px; border: 3px solid rgba(255,255,255,.35);
    background-image: linear-gradient(180deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 45%, rgba(0,0,0,.18) 100%) !important;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    font-weight: 800; font-size: 15px; color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,.35); cursor: pointer; }
  .cbtn small { font-size: 11px; font-weight: 700; opacity: .8; }
  .cbtn.sel { border-color: #fff; transform: translateY(-4px); box-shadow: 0 8px 0 rgba(0,0,0,.35), 0 0 0 3px rgba(255,255,255,.35); }
  .cbtn.empty { opacity: .35; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 18px; }
  .card { background: var(--panel); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 20px 18px; width: 100%;
    max-width: 380px; text-align: center; backdrop-filter: blur(6px); }
  .card h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: -.5px; }
  .card h2 { margin: 0 0 10px; font-size: 22px; }
  .card p { margin: 6px 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .card .big { font-size: 40px; font-weight: 900; margin: 8px 0; }
  .btn { margin-top: 14px; background: var(--accent); color: #111; border: 0; border-radius: 12px; padding: 14px 28px;
    font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 #b38f10; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b38f10; }
  .mix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0 4px; font-size: 13px; }
  .mix div { background: rgba(255,255,255,.06); border-radius: 8px; padding: 6px 2px; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; border: 1px solid rgba(0,0,0,.4); }
  .hidden { display: none !important; }
  .hero { position: relative; height: 150px; margin: -6px 0 6px; }
  .hero img { position: absolute; bottom: 0; }
  .h-boss { height: 140px; left: 50%; transform: translateX(-20%); filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .h-boss:first-child { filter: sepia(1) saturate(6) hue-rotate(-30deg) drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .h-player { height: 130px; left: 50%; transform: translateX(-120%); filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .card h1 { background: linear-gradient(90deg, #ff3d5a, #ff8a1f, #ffd23f, #2fb457, #2f6fe4, #8e44c9); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 34px; font-weight: 900; }
  .rules { text-align: left; font-size: 13.5px; color: var(--muted); line-height: 1.55; margin: 10px 0 0; padding-left: 18px; }
  .rules b { color: var(--text); }
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <canvas id="cv"></canvas>
    <div id="controls" class="hidden"></div>

    <div id="startScreen" class="overlay">
      <div class="card">
        <div class="hero"><img src="assets/boss_goo.webp" alt="" class="h-boss"><img src="assets/boss_rest.webp" alt="" class="h-boss"><img src="assets/player.webp" alt="" class="h-player"></div>
        <h1>페인트 밤 러시</h1>
        <p>몰려오는 적을 <b style="color:#fff">목표 색</b>으로 칠하면 쓰러진다!</p>
        <div class="mix" id="mixChart"></div>
        <ul class="rules">
          <li><b>드래그</b>로 좌우 이동, 사격은 자동</li>
          <li>하단 버튼으로 <b>페인트 색</b> 교체</li>
          <li>목표에 없는 색이 섞이면 <b>오염</b> → <b>신너</b>로 흰색 리셋</li>
          <li>폭발 범위가 있어 <b>주변 적도 같이 칠해짐</b></li>
          <li>도로 위 <b>게이트</b>를 골라 통과해 무기 강화</li>
        </ul>
        <button class="btn" id="startBtn">게임 시작</button>
      </div>
    </div>

    <div id="msgScreen" class="overlay hidden">
      <div class="card">
        <h2 id="msgTitle"></h2>
        <div id="msgBody"></div>
        <button class="btn" id="msgBtn"></button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

// ---------- Colors (3-bit paint mask: R=1, Y=2, B=4) ----------
const R = 1, Y = 2, B = 4, THINNER = -1;
const COLOR = {
  0: { name: '흰색', hex: '#f3f0ea' },
  1: { name: '빨강', hex: '#e8383d' },
  2: { name: '노랑', hex: '#ffd23f' },
  4: { name: '파랑', hex: '#2f6fe4' },
  3: { name: '주황', hex: '#ff8a1f' },
  6: { name: '초록', hex: '#2fb457' },
  5: { name: '보라', hex: '#8e44c9' },
  7: { name: '갈색', hex: '#7a4e2d' },
};
const PRIMS = [R, Y, B];
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k)));
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
}
const mixName = m => PRIMS.filter(p => m & p).map(p => COLOR[p].name).join(' + ');

// ---------- Canvas setup ----------
const W = 420, H = 760;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / W, vh / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  const g = document.getElementById('game');
  g.style.width = (W * scale) + 'px'; g.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// Pseudo-perspective road: far (top) is narrow, near (bottom) is wide.
// Background art: vanishing point at (210, 107) in game coords; road half-width ≈ 0.62*(y-107).
const VP_Y = 107, HORIZON = 118;
const persp = y => Math.min(1.15, 0.22 + 0.78 * Math.max(0, (y - VP_Y) / 500));
const halfRoad = y => Math.min(196, 0.6 * (y - VP_Y) + 10);
const sx = (wx, y) => W / 2 + wx * halfRoad(y);

// ---------- Art assets (generated with Higgsfield) ----------
const IMG = {};
const ASSETS = ['bg', 'player', 'grunt_goo', 'grunt_rest', 'runner_goo', 'runner_rest', 'tank_goo', 'tank_rest', 'boss_goo', 'boss_rest'];
let assetsLeft = ASSETS.length;
const assetsReady = new Promise(res => {
  ASSETS.forEach(n => {
    const im = new Image();
    im.onload = im.onerror = () => { if (--assetsLeft === 0) res(); };
    im.src = 'assets/' + n + '.webp';
    IMG[n] = im;
  });
});
// Paint goo layer is greyscale; multiply it by the enemy's paint colour, then lay the fixed parts (armor, crown, eyes) on top.
const spriteCache = {};
function sprite(kind, mask) {
  const key = kind + mask;
  if (spriteCache[key]) return spriteCache[key];
  const goo = IMG[kind + '_goo'], rest = IMG[kind + '_rest'];
  if (!goo.naturalWidth) return null;
  const c = document.createElement('canvas');
  c.width = goo.naturalWidth; c.height = goo.naturalHeight;
  const x = c.getContext('2d');
  x.drawImage(goo, 0, 0);
  x.globalCompositeOperation = 'multiply';
  x.fillStyle = COLOR[mask] ? COLOR[mask].hex : '#ffffff';
  x.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = 'destination-in';
  x.drawImage(goo, 0, 0);
  x.globalCompositeOperation = 'screen';
  x.globalAlpha = 0.18;
  x.drawImage(goo, 0, 0);
  x.globalAlpha = 1;
  x.globalCompositeOperation = 'source-over';
  if (rest.naturalWidth) x.drawImage(rest, 0, 0);
  spriteCache[key] = c;
  return c;
}
function flashSprite(kind) {
  const key = kind + 'flash';
  if (spriteCache[key]) return spriteCache[key];
  const base = sprite(kind, 0); if (!base) return null;
  const c = document.createElement('canvas'); c.width = base.width; c.height = base.height;
  const x = c.getContext('2d'); x.drawImage(base, 0, 0);
  x.globalCompositeOperation = 'source-atop'; x.fillStyle = 'rgba(255,255,255,.85)'; x.fillRect(0, 0, c.width, c.height);
  spriteCache[key] = c; return c;
}

// ---------- Audio (tiny synth) ----------
let actx = null;
function beep(freq, dur, type = 'square', vol = 0.04, slide = 0) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}

// ---------- Weapons ----------
const WEAPONS = {
  pistol:  { name: '페인트 건', rate: 4.0, shots: 1, spread: 0.0,  speed: 620, r: 7,  splash: 22 },
  shotgun: { name: '샷건',      rate: 1.9, shots: 3, spread: 0.22, speed: 560, r: 7,  splash: 18 },
  gatling: { name: '개틀링',    rate: 9.5, shots: 1, spread: 0.05, speed: 760, r: 5,  splash: 0  },
  bazooka: { name: '바주카',    rate: 1.1, shots: 1, spread: 0.0,  speed: 420, r: 12, splash: 78 },
};

// ---------- Stages ----------
const STAGES = [
  { target: R | Y, pool: [0, 0, R, Y, R, Y],                 rate: 1.1, speed: 42, len: 38 },
  { target: Y | B, pool: [0, Y, B, Y, B, R, 0],              rate: 1.3, speed: 46, len: 42 },
  { target: R | B, pool: [0, R, B, Y, R, B, R | Y, Y | B],   rate: 1.5, speed: 50, len: 46 },
  { target: 7,     pool: [0, R, Y, B, R | Y, Y | B, R | B],  rate: 1.6, speed: 52, len: 48 },
];
function stageCfg(n) {
  if (n < STAGES.length) return STAGES[n];
  const targets = [R | Y, Y | B, R | B, 7];
  const t = targets[n % 4];
  return { target: t, pool: [0, R, Y, B, R | Y, Y | B, R | B], rate: 1.6 + (n - 3) * 0.15, speed: 52 + (n - 3) * 4, len: 50 };
}

// ---------- State ----------
let S;
function newRun() {
  S = {
    stage: 0, score: 0, hp: 5, maxHp: 5,
    weapon: 'pistol', extra: 0, rateMul: 1, splashMul: 1,
    thinner: 8, paint: R,
  };
}
let G; // per-stage
function newStage() {
  const cfg = stageCfg(S.stage);
  G = {
    cfg, t: 0, dist: 0, spawnT: 1.2, gateT: 6, fireT: 0,
    px: 0, tx: 0, py: H - 150,
    bullets: [], enemies: [], gates: [], parts: [], splats: [], texts: [],
    boss: null, bossSpawned: false, intro: 2.4, combo: 0, comboT: 0, shake: 0, over: false, cleared: false,
    roadOff: 0,
  };
  // the starting paint should be useful
  const firstPrim = PRIMS.find(p => cfg.target & p);
  S.paint = firstPrim;
  S.thinner = Math.max(S.thinner, 6);
  buildControls();
}

// ---------- Controls UI ----------
const controls = document.getElementById('controls');
function buildControls() {
  controls.innerHTML = '';
  const opts = [R, Y, B, THINNER];
  opts.forEach((c, i) => {
    const b = document.createElement('div');
    b.className = 'cbtn';
    b.dataset.c = c;
    if (c === THINNER) {
      b.style.backgroundColor = '#d6ecf7';
      b.innerHTML = `🧴 신너<small id="thinCount">${S.thinner}</small>`;
    } else {
      b.style.backgroundColor = COLOR[c].hex;
      if (c === B) b.style.color = '#fff';
      if (c === R) b.style.color = '#fff';
      b.innerHTML = `${COLOR[c].name}<small>${i + 1}</small>`;
    }
    const pick = e => { e.preventDefault(); e.stopPropagation(); selectPaint(c); };
    b.addEventListener('pointerdown', pick);
    controls.appendChild(b);
  });
  refreshControls();
}
function refreshControls() {
  [...controls.children].forEach(b => {
    const c = +b.dataset.c;
    b.classList.toggle('sel', c === S.paint);
    if (c === THINNER) {
      b.classList.toggle('empty', S.thinner <= 0);
      const tc = b.querySelector('#thinCount'); if (tc) tc.textContent = S.thinner;
    }
  });
}
function selectPaint(c) {
  if (c === THINNER && S.thinner <= 0) { beep(140, .12, 'sawtooth', .03); return; }
  S.paint = c; refreshControls(); beep(520, .05, 'triangle', .04);
}

// ---------- Input ----------
let dragging = false, lastX = 0;
cv.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!dragging || !G) return;
  const dx = (e.clientX - lastX) / scale; lastX = e.clientX;
  G.tx = Math.max(-0.92, Math.min(0.92, G.tx + dx / halfRoad(G.py) * 1.15));
});
const endDrag = () => { dragging = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === '1') selectPaint(R);
  if (e.key === '2') selectPaint(Y);
  if (e.key === '3') selectPaint(B);
  if (e.key === '4') selectPaint(THINNER);
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ---------- Spawning ----------
function rnd(a, b) { return a + Math.random() * (b - a); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function spawnEnemy() {
  const cfg = G.cfg;
  const roll = Math.random();
  let type = 'grunt';
  if (S.stage >= 1 && roll < 0.18) type = 'runner';
  else if (S.stage >= 2 && roll > 0.9) type = 'tank';
  const base = { grunt: { r: 22, sp: 1 }, runner: { r: 16, sp: 1.7 }, tank: { r: 31, sp: 0.62 } }[type];
  const count = type === 'grunt' && Math.random() < 0.35 ? 3 : 1;
  const cx = rnd(-0.75, 0.75);
  const mask = pick(cfg.pool);
  for (let i = 0; i < count; i++) {
    G.enemies.push({
      wx: Math.max(-0.9, Math.min(0.9, cx + (i - (count - 1) / 2) * 0.17)),
      y: HORIZON + 4 - i * 6 - Math.random() * 6,
      type, r: base.r, speed: cfg.speed * base.sp * rnd(0.9, 1.1),
      mask: count > 1 && Math.random() < 0.4 ? pick(cfg.pool) : mask,
      flash: 0, wob: Math.random() * 6, hp: type === 'tank' ? 2 : 1, dead: false,
    });
  }
}

const GOOD_GATES = [
  { label: '+1 탄', icon: '🔫', apply: () => { S.extra = Math.min(S.extra + 1, 4); } },
  { label: '연사 +25%', icon: '⚡', apply: () => { S.rateMul = Math.min(S.rateMul * 1.25, 3); } },
  { label: '폭발 +30%', icon: '💥', apply: () => { S.splashMul = Math.min(S.splashMul * 1.3, 2.6); } },
  { label: '신너 +5', icon: '🧴', apply: () => { S.thinner += 5; refreshControls(); } },
  { label: '체력 +1', icon: '❤️', apply: () => { S.hp = Math.min(S.maxHp, S.hp + 1); } },
  { label: '샷건', icon: '🔶', weapon: 'shotgun', apply: () => { S.weapon = 'shotgun'; } },
  { label: '개틀링', icon: '🔷', weapon: 'gatling', apply: () => { S.weapon = 'gatling'; } },
  { label: '바주카', icon: '🚀', weapon: 'bazooka', apply: () => { S.weapon = 'bazooka'; } },
  { label: '페인트 건', icon: '🎯', weapon: 'pistol', apply: () => { S.weapon = 'pistol'; } },
];
const BAD_GATES = [
  { label: '-1 탄', icon: '🔻', bad: true, apply: () => { S.extra = Math.max(0, S.extra - 1); } },
  { label: '연사 -20%', icon: '🐌', bad: true, apply: () => { S.rateMul = Math.max(0.6, S.rateMul * 0.8); } },
  { label: '신너 -3', icon: '💧', bad: true, apply: () => { S.thinner = Math.max(0, S.thinner - 3); refreshControls(); } },
];
function spawnGate() {
  const goods = GOOD_GATES.filter(g => !g.weapon || g.weapon !== S.weapon);
  const a = pick(goods);
  let b = Math.random() < 0.45 ? pick(BAD_GATES) : pick(goods.filter(g => g !== a));
  const pair = Math.random() < 0.5 ? [a, b] : [b, a];
  G.gates.push({ y: HORIZON + 6, opts: pair, used: false });
}

function spawnBoss() {
  G.bossSpawned = true;
  const startMasks = PRIMS.filter(p => p !== G.cfg.target);
  G.boss = {
    wx: 0, y: HORIZON + 30, r: 62, speed: 16 + S.stage * 2,
    mask: pick([0, ...startMasks]), hp: 5 + S.stage, maxHp: 5 + S.stage, flash: 0, wob: 0, hitCd: 0,
  };
  addText(W / 2, H * 0.32, '⚠ 보스 등장!', '#ff5a5a', 30, 1.6);
  beep(110, .6, 'sawtooth', .05, -50);
}

// ---------- Effects ----------
function addText(x, y, s, col, size = 18, life = 0.9) { G.texts.push({ x, y, s, col, size, life, max: life }); }
function burst(x, y, hex, n = 14, spd = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rnd(spd * 0.3, spd);
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(.35, .8), r: rnd(2, 5), col: hex });
  }
}
function splat(x, y, hex, r) {
  const n = 11, radii = Array.from({ length: n }, () => rnd(0.6, 1.15));
  const drops = Array.from({ length: 5 }, () => ({ a: Math.random() * 6.3, d: rnd(1.2, 1.9), s: rnd(0.08, 0.2) }));
  G.splats.push({ x, y, hex, r, radii, drops, life: 6 });
  if (G.splats.length > 70) G.splats.shift();
}

// ---------- Paint logic ----------
const contaminated = m => (m & ~G.cfg.target) !== 0;
function paintEnemy(e, c, isBoss) {
  const before = e.mask;
  e.mask = c === THINNER ? 0 : (e.mask | c);
  e.flash = 0.12;
  if (e.mask === G.cfg.target) {
    if (isBoss) return bossHit(e);
    e.hp--;
    if (e.hp <= 0) killEnemy(e);
    else { e.mask = pick(PRIMS.filter(p => p !== G.cfg.target)); addText(sx(e.wx, e.y), e.y - 30, '한 번 더!', '#fff', 15); }
  } else if (!contaminated(before) && contaminated(e.mask)) {
    addText(sx(e.wx, e.y), e.y - 28, '오염!', '#c99a6b', 15, .7);
  }
}
function killEnemy(e) {
  e.dead = true;
  const x = sx(e.wx, e.y);
  G.combo++; G.comboT = 1.6;
  const pts = (e.type === 'tank' ? 30 : e.type === 'runner' ? 15 : 10) * Math.min(5, 1 + Math.floor(G.combo / 5));
  S.score += pts;
  burst(x, e.y, COLOR[G.cfg.target].hex, 18, 220);
  splat(x, e.y, COLOR[G.cfg.target].hex, e.r * persp(e.y) * 1.8);
  addText(x, e.y - 20, '+' + pts, '#fff', 16, .7);
  if (G.combo > 0 && G.combo % 10 === 0) addText(W / 2, H * 0.45, G.combo + ' 콤보!', '#ffd23f', 28, 1);
  beep(660 + Math.random() * 200, .09, 'triangle', .05, 300);
}
function bossHit(b) {
  if (b.hitCd > 0) return;
  b.hp--; b.hitCd = 0.5; G.shake = 0.3;
  S.score += 100;
  const x = sx(b.wx, b.y);
  burst(x, b.y, COLOR[G.cfg.target].hex, 30, 280);
  addText(x, b.y - 70, '명중! +100', '#ffd23f', 22, 1);
  beep(220, .25, 'square', .06, -100);
  if (b.hp <= 0) { stageClear(); return; }
  // boss changes colour: sometimes a contaminating one
  const opts = [0, ...PRIMS.filter(p => p !== G.cfg.target)];
  if (S.stage >= 1) opts.push(...PRIMS.filter(p => !(G.cfg.target & p)));
  b.mask = pick(opts);
}

// ---------- Firing ----------
function fire() {
  const w = WEAPONS[S.weapon];
  const isThin = S.paint === THINNER;
  if (isThin && S.thinner <= 0) { S.paint = PRIMS.find(p => G.cfg.target & p); refreshControls(); }
  const x0 = sx(G.px, G.py) + 24, y0 = G.py - 78;
  const lanes = 1 + S.extra;
  for (let l = 0; l < lanes; l++) {
    const off = (l - (lanes - 1) / 2) * 13;
    for (let s = 0; s < w.shots; s++) {
      const ang = (s - (w.shots - 1) / 2) * w.spread + rnd(-0.02, 0.02);
      G.bullets.push({
        x: x0 + off, y: y0, vx: Math.sin(ang) * w.speed, vy: -Math.cos(ang) * w.speed,
        c: S.paint, r: w.r, splash: w.splash * S.splashMul,
      });
    }
  }
  if (S.paint === THINNER) { S.thinner--; refreshControls(); if (S.thinner <= 0) { S.paint = PRIMS.find(p => G.cfg.target & p); refreshControls(); } }
  beep(S.weapon === 'bazooka' ? 160 : 900, .04, 'square', .015, -200);
}

function explode(bl, hitEnemy) {
  const hex = bl.c === THINNER ? '#cfe8f5' : COLOR[bl.c].hex;
  burst(bl.x, bl.y, hex, bl.splash > 50 ? 22 : 8, bl.splash > 50 ? 240 : 120);
  splat(bl.x, bl.y, hex, 6 + bl.splash * 0.25);
  const touched = new Set();
  if (hitEnemy) touched.add(hitEnemy);
  if (bl.splash > 0) {
    for (const e of G.enemies) {
      if (e.dead || touched.has(e)) continue;
      const ex = sx(e.wx, e.y), er = e.r * persp(e.y);
      if (Math.hypot(ex - bl.x, e.y - bl.y) < bl.splash + er) touched.add(e);
    }
    if (G.boss && !touched.has(G.boss)) {
      const b = G.boss, bx = sx(b.wx, b.y);
      if (Math.hypot(bx - bl.x, b.y - bl.y) < bl.splash + b.r * persp(b.y)) touched.add(b);
    }
    if (bl.splash > 50) { G.shake = Math.max(G.shake, 0.15); beep(90, .2, 'sawtooth', .05, -40); }
  }
  for (const e of touched) if (!e.dead) paintEnemy(e, bl.c, e === G.boss);
}

// ---------- Update ----------
function update(dt) {
  if (G.over || G.cleared) return;
  G.t += dt;
  if (G.intro > 0) { G.intro -= dt; }

  // movement
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) G.tx = Math.max(-0.92, G.tx - 2.2 * dt);
  if (keys['ArrowRight'] || keys['d'] || keys['D']) G.tx = Math.min(0.92, G.tx + 2.2 * dt);
  G.px += (G.tx - G.px) * Math.min(1, dt * 14);

  G.roadOff = (G.roadOff + dt * 120) % 60;

  if (G.intro > 0) return;

  // progress + spawning
  if (!G.bossSpawned) {
    G.dist += dt / G.cfg.len;
    G.spawnT -= dt;
    if (G.spawnT <= 0) { spawnEnemy(); G.spawnT = rnd(0.7, 1.3) / G.cfg.rate * 1.35; }
    G.gateT -= dt;
    if (G.gateT <= 0 && G.dist < 0.92) { spawnGate(); G.gateT = rnd(7, 10); }
    if (G.dist >= 1) spawnBoss();
  }

  // fire
  G.fireT -= dt;
  if (G.fireT <= 0) { fire(); G.fireT = 1 / (WEAPONS[S.weapon].rate * S.rateMul); }

  // bullets
  for (const bl of G.bullets) {
    bl.x += bl.vx * dt; bl.y += bl.vy * dt;
    if (bl.y < VP_Y || bl.x < -20 || bl.x > W + 20) { bl.dead = true; continue; }
    // collisions
    let hit = null;
    for (const e of G.enemies) {
      if (e.dead) continue;
      const ex = sx(e.wx, e.y), er = e.r * persp(e.y);
      if (Math.hypot(ex - bl.x, e.y - bl.y) < er + bl.r) { hit = e; break; }
    }
    if (!hit && G.boss) {
      const b = G.boss, bx = sx(b.wx, b.y);
      if (Math.hypot(bx - bl.x, b.y - bl.y) < b.r * persp(b.y) + bl.r) hit = b;
    }
    if (hit) { bl.dead = true; explode(bl, hit); }
  }
  G.bullets = G.bullets.filter(b => !b.dead);

  // enemies
  for (const e of G.enemies) {
    if (e.dead) continue;
    e.wob += dt * 8;
    e.y += e.speed * dt * (0.6 + persp(e.y) * 0.9);
    e.wx += Math.sin(e.wob * 0.3) * dt * 0.05;
    if (e.flash > 0) e.flash -= dt;
    if (e.y > G.py - 10) {
      e.dead = true; hurt(e.type === 'tank' ? 2 : 1);
      burst(sx(e.wx, e.y), e.y, '#ff4040', 12, 160);
    }
  }
  G.enemies = G.enemies.filter(e => !e.dead);

  // boss
  if (G.boss) {
    const b = G.boss;
    b.wob += dt; b.hitCd -= dt; if (b.flash > 0) b.flash -= dt;
    b.y = Math.min(b.y + b.speed * dt, G.py - 20);
    b.wx = Math.sin(b.wob * 0.7) * 0.55;
    if (Math.random() < dt * (0.9 + S.stage * 0.15)) {
      // boss summons minions
      const m = pick(G.cfg.pool);
      G.enemies.push({ wx: b.wx + rnd(-0.3, 0.3), y: b.y + 20, type: 'runner', r: 15, speed: G.cfg.speed * 1.5, mask: m, flash: 0, wob: 0, hp: 1, dead: false });
    }
    if (b.y >= G.py - 20) { hurt(99); }
  }

  // gates
  for (const g of G.gates) {
    g.y += 75 * dt * (0.6 + persp(g.y) * 0.9);
    if (!g.used && g.y >= G.py - 6) {
      g.used = true;
      const side = G.px < 0 ? 0 : 1;
      const opt = g.opts[side];
      opt.apply();
      addText(sx(side ? 0.5 : -0.5, G.py), G.py - 60, opt.icon + ' ' + opt.label, opt.bad ? '#ff6b6b' : '#7dffa0', 22, 1.2);
      beep(opt.bad ? 180 : 880, .18, 'triangle', .06, opt.bad ? -80 : 400);
      g.pickSide = side; g.fade = 0.4;
    }
    if (g.used) g.fade -= dt;
  }
  G.gates = G.gates.filter(g => !g.used || g.fade > 0);

  // fx
  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const s of G.splats) { s.y += 120 * dt * persp(s.y); s.life -= dt; }
  G.splats = G.splats.filter(s => s.life > 0 && s.y < H + 40);
  for (const t of G.texts) { t.y -= 30 * dt; t.life -= dt; }
  G.texts = G.texts.filter(t => t.life > 0);
  if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) G.combo = 0; }
  if (G.shake > 0) G.shake -= dt;
}

function hurt(n) {
  S.hp -= n; G.shake = 0.35; G.combo = 0;
  beep(120, .25, 'sawtooth', .06, -60);
  if (navigator.vibrate) navigator.vibrate(60);
  if (S.hp <= 0) { S.hp = 0; gameOver(); }
}

// ---------- Rendering ----------
function draw() {
  ctx.save();
  if (G && G.shake > 0) ctx.translate(rnd(-5, 5) * G.shake * 2, rnd(-5, 5) * G.shake * 2);

  // background art
  if (IMG.bg.naturalWidth) ctx.drawImage(IMG.bg, -6, -6, W + 12, H + 12);
  else { ctx.fillStyle = '#2a2f38'; ctx.fillRect(-20, -20, W + 40, H + 40); }

  // scrolling centre dashes, evenly spaced in depth so they speed up toward the camera
  const off = G ? G.roadOff / 60 : 0;
  ctx.fillStyle = 'rgba(245,245,240,.92)';
  for (let i = 0; i < 14; i++) {
    const z = (i + off) / 14;
    const y0 = VP_Y + 6 + Math.pow(z, 2.2) * (H - VP_Y);
    const y1 = VP_Y + 6 + Math.pow(z + 0.035, 2.2) * (H - VP_Y);
    const w = 1.2 + 0.024 * (y0 - VP_Y);
    ctx.beginPath();
    ctx.moveTo(W / 2 - w * 0.8, y0); ctx.lineTo(W / 2 + w * 0.8, y0);
    ctx.lineTo(W / 2 + w, y1); ctx.lineTo(W / 2 - w, y1); ctx.fill();
  }

  if (!G) { ctx.restore(); return; }

  // splats: organic blobs squashed by perspective
  for (const s of G.splats) {
    ctx.globalAlpha = Math.min(1, s.life / 2) * 0.7;
    ctx.fillStyle = s.hex;
    const n = s.radii.length;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const k = i % n, a = k / n * Math.PI * 2, rr = s.r * s.radii[k];
      const px = s.x + Math.cos(a) * rr, py = s.y + Math.sin(a) * rr * 0.5;
      if (i === 0) ctx.moveTo(px, py);
      else {
        const pa = (k - 0.5) / n * Math.PI * 2, pr = s.r * (s.radii[k] + s.radii[(k + n - 1) % n]) * 0.62;
        ctx.quadraticCurveTo(s.x + Math.cos(pa) * pr, s.y + Math.sin(pa) * pr * 0.5, px, py);
      }
    }
    ctx.fill();
    for (const d of s.drops) {
      ctx.beginPath(); ctx.ellipse(s.x + Math.cos(d.a) * s.r * d.d, s.y + Math.sin(d.a) * s.r * d.d * 0.5, s.r * d.s, s.r * d.s * 0.5, 0, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // gates
  for (const g of G.gates) drawGate(g);

  // enemies sorted by y (far first)
  const ents = [...G.enemies];
  if (G.boss) ents.push(G.boss);
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) e === G.boss ? drawBoss(e) : drawEnemy(e);

  // bullets: glossy paint balls with a short trail
  for (const bl of G.bullets) {
    const hex = bl.c === THINNER ? '#cfe8f5' : COLOR[bl.c].hex;
    const r = bl.r * (0.55 + persp(bl.y) * 0.6);
    const len = Math.hypot(bl.vx, bl.vy), tx = -bl.vx / len, ty = -bl.vy / len;
    const tg = ctx.createLinearGradient(bl.x, bl.y, bl.x + tx * r * 5, bl.y + ty * r * 5);
    tg.addColorStop(0, hex); tg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = tg; ctx.lineWidth = r * 1.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bl.x, bl.y); ctx.lineTo(bl.x + tx * r * 5, bl.y + ty * r * 5); ctx.stroke();
    const bg = ctx.createRadialGradient(bl.x - r * 0.35, bl.y - r * 0.35, r * 0.1, bl.x, bl.y, r);
    bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.35, hex); bg.addColorStop(1, shade(hex, -0.35));
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(bl.x, bl.y, r, 0, 7); ctx.fill();
  }

  drawPlayer();

  // particles
  for (const p of G.parts) {
    ctx.globalAlpha = Math.max(0, p.life * 1.5); ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // floating text
  ctx.textAlign = 'center';
  for (const t of G.texts) {
    ctx.globalAlpha = Math.min(1, t.life / t.max * 2);
    ctx.font = `900 ${t.size}px system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)';
    ctx.strokeText(t.s, t.x, t.y); ctx.fillStyle = t.col; ctx.fillText(t.s, t.x, t.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
  drawHUD();
}

function blob(x, y, r, hex, wob) {
  ctx.fillStyle = hex;
  ctx.beginPath();
  for (let i = 0; i <= 14; i++) {
    const a = i / 14 * Math.PI * 2;
    const rr = r * (1 + Math.sin(a * 3 + wob) * 0.06);
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.fill();
}

function drawEnemy(e) {
  const p = persp(e.y), x = sx(e.wx, e.y), r = e.r * p;
  const bob = Math.abs(Math.sin(e.wob)) * -4 * p;
  const spr = e.flash > 0 ? flashSprite(e.type) : sprite(e.type, e.mask);
  ctx.fillStyle = 'rgba(0,0,0,.32)';
  ctx.beginPath(); ctx.ellipse(x, e.y + r * 1.05, r * 1.05, r * 0.32, 0, 0, 7); ctx.fill();
  if (spr) {
    const h = r * 3.3, w = h * spr.width / spr.height;
    ctx.save(); ctx.translate(x, e.y + r * 1.1 + bob); ctx.rotate(Math.sin(e.wob) * 0.06);
    ctx.drawImage(spr, -w / 2, -h, w, h);
    ctx.restore();
  }
  drawNeed(x, e.y - r * 2.05 + bob, e.mask, Math.max(0.6, p));
}

function drawNeed(x, y, mask, p) {
  const target = G.cfg.target;
  if (contaminated(mask)) {
    ctx.font = `${Math.round(14 * p)}px system-ui`; ctx.textAlign = 'center';
    ctx.fillText('🧴', x, y + 4 * p);
    return;
  }
  const need = PRIMS.filter(c => (target & c) && !(mask & c));
  const d = 9 * p;
  need.forEach((c, i) => {
    const dx = (i - (need.length - 1) / 2) * (d * 1.25);
    ctx.fillStyle = COLOR[c].hex; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(x + dx, y, d * 0.5, 0, 7); ctx.fill(); ctx.stroke();
  });
}

function drawBoss(b) {
  const p = persp(b.y), x = sx(b.wx, b.y), r = b.r * p;
  ctx.fillStyle = 'rgba(0,0,0,.38)';
  ctx.beginPath(); ctx.ellipse(x, b.y + r * 0.95, r * 1.1, r * 0.3, 0, 0, 7); ctx.fill();
  const spr = b.flash > 0 ? flashSprite('boss') : sprite('boss', b.mask);
  const h = r * 2.5;
  if (spr) {
    const w = h * spr.width / spr.height, sq = 1 + Math.sin(b.wob * 5) * 0.025;
    ctx.save(); ctx.translate(x, b.y + r); ctx.scale(1 / sq, sq);
    ctx.drawImage(spr, -w / 2, -h, w, h); ctx.restore();
  }
  const bw = Math.max(110, r * 2), top = Math.max(118, b.y + r - h - 16);
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.beginPath(); ctx.roundRect(x - bw / 2, top, bw, 12, 6); ctx.fill();
  ctx.fillStyle = '#ff3d5a'; ctx.beginPath(); ctx.roundRect(x - bw / 2 + 2, top + 2, (bw - 4) * b.hp / b.maxHp, 8, 4); ctx.fill();
  drawNeed(x, b.y + r + 16, b.mask, 1.4);
}

function drawGate(g) {
  const p = persp(g.y), h = 58 * p;
  const alpha = g.used ? Math.max(0, g.fade / 0.4) : 1;
  ctx.globalAlpha = alpha;
  for (let side = 0; side < 2; side++) {
    const opt = g.opts[side];
    const xl = sx(side ? 0.04 : -0.98, g.y), xr = sx(side ? 0.98 : -0.04, g.y);
    const top = g.y - h, base = opt.bad ? [255, 70, 90] : [70, 190, 255];
    const picked = g.used && g.pickSide === side;
    const gr = ctx.createLinearGradient(0, top, 0, g.y);
    gr.addColorStop(0, `rgba(${base},${picked ? .9 : .25})`); gr.addColorStop(1, `rgba(${base},${picked ? .9 : .6})`);
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.roundRect(xl, top, xr - xl, h, 8 * p); ctx.fill();
    ctx.shadowColor = `rgb(${base})`; ctx.shadowBlur = 14 * p;
    ctx.strokeStyle = `rgb(${base.map(c => Math.min(255, c + 90))})`; ctx.lineWidth = 3 * p;
    ctx.stroke(); ctx.shadowBlur = 0;
    // glass shine
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.roundRect(xl + 4 * p, top + 4 * p, (xr - xl) - 8 * p, h * 0.28, 6 * p); ctx.fill();
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.font = `900 ${Math.round(22 * p)}px system-ui, sans-serif`;
    ctx.lineWidth = 4 * p; ctx.strokeStyle = 'rgba(0,0,0,.55)';
    ctx.strokeText(opt.icon, (xl + xr) / 2, top + h * 0.48); ctx.fillText(opt.icon, (xl + xr) / 2, top + h * 0.48);
    ctx.font = `900 ${Math.round(15 * p)}px system-ui, sans-serif`;
    ctx.strokeText(opt.label, (xl + xr) / 2, top + h * 0.85); ctx.fillText(opt.label, (xl + xr) / 2, top + h * 0.85);
  }
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const x = sx(G.px, G.py), y = G.py;
  const hex = S.paint === THINNER ? '#cfe8f5' : COLOR[S.paint].hex;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(x, y + 44, 30, 10, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = hex; ctx.lineWidth = 4; ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.ellipse(x, y + 44, 34, 12, 0, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  const im = IMG.player;
  if (im.naturalWidth) {
    const h = 140, w = h * im.naturalWidth / im.naturalHeight;
    ctx.drawImage(im, x - w / 2, y + 48 - h + Math.sin(G.t * 12) * 2, w, h);
  }
  ctx.fillStyle = hex; ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.arc(x + 24, y - 77, 5 + Math.sin(G.t * 30) * 1.5, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
}

function drawHUD() {
  if (!G) return;
  const target = G.cfg.target;
  // top panel
  const pg = ctx.createLinearGradient(0, 0, 0, 112);
  pg.addColorStop(0, 'rgba(12,10,24,.92)'); pg.addColorStop(1, 'rgba(12,10,24,.72)');
  ctx.fillStyle = pg; ctx.beginPath(); ctx.roundRect(8, 8, W - 16, 98, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1; ctx.stroke();
  // target swatch as a paint drop
  const tx = 40, ty = 42;
  ctx.shadowColor = COLOR[target].hex; ctx.shadowBlur = 14;
  const tg = ctx.createRadialGradient(tx - 8, ty - 8, 2, tx, ty, 26);
  tg.addColorStop(0, shade(COLOR[target].hex, 0.5)); tg.addColorStop(0.5, COLOR[target].hex); tg.addColorStop(1, shade(COLOR[target].hex, -0.3));
  ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(tx, ty, 24, 0, 7); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
  ctx.textAlign = 'left'; ctx.fillStyle = '#b8b0d6'; ctx.font = '800 11px system-ui, sans-serif';
  ctx.fillText(`STAGE ${S.stage + 1}  ·  목표 색`, 74, 28);
  ctx.fillStyle = '#fff'; ctx.font = '900 22px system-ui, sans-serif';
  ctx.fillText(COLOR[target].name, 74, 54);
  const nameW = ctx.measureText(COLOR[target].name).width;
  // recipe chips
  let cx = 74 + nameW + 10;
  PRIMS.filter(c => target & c).forEach((c, i) => {
    if (i) { ctx.fillStyle = '#b8b0d6'; ctx.font = '800 13px system-ui'; ctx.fillText('+', cx, 52); cx += 12; }
    ctx.fillStyle = COLOR[c].hex; ctx.beginPath(); ctx.arc(cx + 7, 47, 7, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5; ctx.stroke(); cx += 18;
  });
  // score + hp
  ctx.textAlign = 'right'; ctx.fillStyle = '#ffd23f'; ctx.font = '900 22px system-ui, sans-serif';
  ctx.fillText(S.score.toLocaleString(), W - 20, 34);
  for (let i = 0; i < S.maxHp; i++) {
    const hx = W - 26 - i * 19, hy = 50;
    ctx.fillStyle = i < S.hp ? '#ff3d5a' : 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.moveTo(hx, hy + 12);
    ctx.bezierCurveTo(hx - 10, hy + 5, hx - 8, hy - 3, hx, hy + 2);
    ctx.bezierCurveTo(hx + 8, hy - 3, hx + 10, hy + 5, hx, hy + 12); ctx.fill();
  }
  // progress bar
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.roundRect(18, 72, W - 36, 7, 4); ctx.fill();
  const prg = ctx.createLinearGradient(18, 0, W - 18, 0);
  prg.addColorStop(0, '#ffd23f'); prg.addColorStop(0.5, '#ff8a1f'); prg.addColorStop(1, '#ff3d5a');
  ctx.fillStyle = prg; ctx.beginPath(); ctx.roundRect(18, 72, Math.max(7, (W - 36) * Math.min(1, G.dist)), 7, 4); ctx.fill();
  ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.fillText('👑', W - 18, 80);
  // weapon info
  ctx.textAlign = 'left'; ctx.font = '700 11.5px system-ui, sans-serif'; ctx.fillStyle = '#d8d2ec';
  const wi = `${WEAPONS[S.weapon].name}  ·  ${1 + S.extra}줄  ·  연사 x${S.rateMul.toFixed(2)}  ·  폭발 x${S.splashMul.toFixed(1)}`;
  ctx.fillText(wi, 18, 97);
  if (G.combo >= 3) { ctx.textAlign = 'right'; ctx.fillStyle = '#ffd23f'; ctx.font = '900 13px system-ui'; ctx.fillText(G.combo + ' COMBO', W - 18, 97); }

  // intro banner
  if (G.intro > 0) {
    const a = Math.min(1, G.intro);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, H * 0.33, W, 150);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '800 18px system-ui, sans-serif';
    ctx.fillText(`STAGE ${S.stage + 1}`, W / 2, H * 0.33 + 34);
    ctx.fillStyle = COLOR[target].hex; ctx.font = '900 40px system-ui, sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = '#000';
    ctx.strokeText(`목표: ${COLOR[target].name}`, W / 2, H * 0.33 + 84); ctx.fillText(`목표: ${COLOR[target].name}`, W / 2, H * 0.33 + 84);
    ctx.fillStyle = '#ddd'; ctx.font = '700 16px system-ui, sans-serif';
    ctx.fillText(mixName(target) + ' 을(를) 섞어 칠하세요!', W / 2, H * 0.33 + 120);
    ctx.globalAlpha = 1;
  }
}

// ---------- Screens ----------
const startScreen = document.getElementById('startScreen');
const msgScreen = document.getElementById('msgScreen');
const msgTitle = document.getElementById('msgTitle'), msgBody = document.getElementById('msgBody'), msgBtn = document.getElementById('msgBtn');
let msgAction = null;
msgBtn.addEventListener('click', () => { msgScreen.classList.add('hidden'); msgAction && msgAction(); });

const dot = m => `<span class="dot" style="background:${COLOR[m].hex}"></span>`;
document.getElementById('mixChart').innerHTML = [[R, Y], [Y, B], [R, B]].map(([a, b]) =>
  `<div>${dot(a)}+${dot(b)} = ${dot(a | b)} ${COLOR[a | b].name}</div>`).join('');

document.getElementById('startBtn').addEventListener('click', async () => {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  startScreen.classList.add('hidden');
  await assetsReady;
  newRun(); newStage();
  controls.classList.remove('hidden');
});

function stageClear() {
  G.cleared = true;
  const bonus = S.hp * 50;
  S.score += bonus;
  const nextCfg = stageCfg(S.stage + 1);
  msgTitle.textContent = `STAGE ${S.stage + 1} 클리어! 🎉`;
  msgBody.innerHTML = `<p>체력 보너스 +${bonus}</p><div class="big">${S.score.toLocaleString()}</div>
    <p>다음 목표: ${dot(nextCfg.target)} <b style="color:#fff">${COLOR[nextCfg.target].name}</b> (${mixName(nextCfg.target)})</p>`;
  msgBtn.textContent = '다음 스테이지';
  msgAction = () => { S.stage++; S.hp = Math.min(S.maxHp, S.hp + 1); newStage(); };
  msgScreen.classList.remove('hidden');
  beep(523, .15, 'triangle', .06); setTimeout(() => beep(659, .15, 'triangle', .06), 150); setTimeout(() => beep(784, .3, 'triangle', .06), 300);
}
function gameOver() {
  G.over = true;
  let best = 0;
  try { best = +localStorage.getItem('pbr_best') || 0; if (S.score > best) { best = S.score; localStorage.setItem('pbr_best', best); } } catch (e) {}
  msgTitle.textContent = '게임 오버';
  msgBody.innerHTML = `<p>STAGE ${S.stage + 1} 까지 도달</p><div class="big">${S.score.toLocaleString()}</div><p>최고 기록 ${best.toLocaleString()}</p>`;
  msgBtn.textContent = '다시 하기';
  msgAction = () => { newRun(); newStage(); };
  msgScreen.classList.remove('hidden');
}

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G) update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// test hook
window.__pbr = { get S() { return S; }, get G() { return G; } };
})();
</script>
</body>
